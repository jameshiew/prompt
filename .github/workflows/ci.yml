name: CI
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - "**.rs"
      - ".github/workflows/*.yml"
      - Justfile
      - mise.lock
      - mise.toml
      - rustfmt.toml
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - "**.rs"
      - ".github/workflows/*.yml"
      - Justfile
      - mise.lock
      - mise.toml
      - rustfmt.toml

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: true
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_TEST_DEBUG: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
          cache: false
      - uses: jdx/mise-action@v4
      - run: just fmt-check
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - uses: jdx/mise-action@v4
      - run: just lint
      - run: just test
