name: Dependencies
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/dependencies.yml
      - Justfile
      - deny.toml
      - mise.lock
      - mise.toml
  push:
    branches:
      - main
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - .github/workflows/dependencies.yml
      - Justfile
      - deny.toml
      - mise.lock
      - mise.toml

env:
  CARGO_TERM_COLOR: always
  CARGO_TERM_VERBOSE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: jdx/mise-action@v4
      - run: just dep-check
